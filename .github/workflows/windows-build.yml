name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NetCheck.sln --property:Configuration=Release

      - name: Build
        run: dotnet build NetCheck.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test NetCheck.sln --configuration Release --no-build --nologo --collect:"XPlat Code Coverage"

      - name: Publish self-contained application
        run: dotnet publish src/NetCheck.App/NetCheck.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-build --output artifacts/publish/win-x64 --nologo

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: NetCheck-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
