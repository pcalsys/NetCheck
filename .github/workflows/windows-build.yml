name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and package
        shell: cmd
        run: build.cmd -CollectCoverage

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: NetCheck-win-x64
          path: |
            artifacts/publish/win-x64
            artifacts/NetCheck-*-win-x64.zip
            artifacts/NetCheck-*-win-x64.zip.sha256
          if-no-files-found: error
